<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error": "#ffffff", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#2e1500", "on-primary-container": "#8ec2a4", "on-primary": "#ffffff", "secondary-fixed-dim": "#b6ccbe", "primary-fixed-dim": "#9dd2b3", "on-tertiary-container": "#dcae88", "on-secondary-container": "#55695e", "on-error-container": "#93000a", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#1d5038", "on-secondary": "#ffffff", "error": "#ba1a1a", "surface": "#f9f9fc", "tertiary-container": "#624123", "surface-dim": "#dadadc", "primary-container": "#1e5139", "on-surface-variant": "#414943", "secondary-container": "#d2e8da", "surface-variant": "#e2e2e5", "secondary-fixed": "#d2e8da", "error-container": "#ffdad6", "on-surface": "#1a1c1e", "on-secondary-fixed-variant": "#384b41", "surface-container-low": "#f3f3f6", "surface-container": "#eeeef0", "on-tertiary-fixed-variant": "#604022", "outline": "#717972", "secondary": "#4f6358", "tertiary": "#482b0f", "tertiary-fixed": "#ffdcc1", "primary": "#003a24", "outline-variant": "#c0c9c1", "surface-bright": "#f9f9fc", "on-primary-fixed": "#002112", "on-secondary-fixed": "#0c1f17", "inverse-on-surface": "#f0f0f3", "on-background": "#1a1c1e", "primary-fixed": "#b8efce", "surface-tint": "#36684e", "inverse-primary": "#9dd2b3", "background": "#f9f9fc", "inverse-surface": "#2f3133", "surface-container-highest": "#e2e2e5", "tertiary-fixed-dim": "#edbd96", "surface-container-high": "#e8e8ea" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter-desktop": "1.5rem", "margin-tablet": "2rem", "gutter": "1.25rem", "margin": "1.25rem", "space-md": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin-desktop": "3rem", "space-xl": "2.5rem", "space-lg": "1.5rem" }, fontFamily: { "title-md": ["Space Grotesk"], "body-lg": ["Inter"], "label-md": ["Space Grotesk"], "display-lg": ["Space Grotesk"], "headline-sm": ["Space Grotesk"], "display-lg-mobile": ["Space Grotesk"], "headline-lg": ["Space Grotesk"], "label-lg": ["Space Grotesk"], "headline-lg-mobile": ["Space Grotesk"], "body-sm": ["Inter"], "body-md": ["Inter"], "label-sm": ["Space Grotesk"], "headline-md": ["Space Grotesk"] }, fontSize: { "title-md": ["16px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }], "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }], "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.03em", fontWeight: "600" }], "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "500" }], "display-lg-mobile": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "600" }], "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }], "headline-lg-mobile": ["26px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "600" }], "body-sm": ["13px", { lineHeight: "20px", fontWeight: "400" }], "body-md": ["15px", { lineHeight: "24px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "600" }], "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "500" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-secondary-container selection:text-on-secondary-container"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand & Calming Header -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-xl">
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center mb-space-md shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low mb-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">Un paso. Solo uno. Ahora.</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-xs">
      Iniciar sesión
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Retoma tu ritmo sereno. Un micro-paso a la vez.
    </p>
</div>
<!-- Ambient Photo Vignette (Mindful Warmth) -->
<div class="relative w-full h-28 rounded-xl overflow-hidden mb-space-lg shadow-sm">
<div class="w-full h-full bg-cover bg-center" data-alt="Minimalist architectural desk bathed in gentle morning sunlight. A clean ceramic cup of warm tea sits beside an open linen notebook and a delicate green eucalyptus sprig. Earthy warm tones, serene shadow play, soft beige and muted sage green atmosphere, cinematic 35mm photograph." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCHf1QuGFnfnbDXOIPX-0Frn9ea9aqKGVzd1JMLGdS2l6vzzO6AUtkP72Hna-4BdseubdkPDUJSi5c1CldQoqWNZgZyxPtgNu2X27_8EyeF3jx7KPjToxQrUBoDJQ1B_WM3at8XREG5wLS0CmjhwYtU-Y-YKmMCpqSlUFiPc4rqg8FpX9ZinElem8J5mGof6WGpG7JiawoQ4DV7GXriWQ_cezDQgoWWNwZokFHCQN9YcnF7HN1PJLOn')">
</div>
<div class="absolute inset-0 bg-gradient-to-r from-surface-container-lowest/80 via-transparent to-surface-container-lowest/40 flex items-center px-space-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-title-md">eco</span>
<span class="font-label-md text-label-md text-on-surface font-medium">Espacio libre de ruido mental</span>
</div>
</div>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-space-md w-full" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="emailInput">
        Correo electrónico
      </label>
<div class="relative flex items-center bg-surface-container-lowest rounded-lg shadow-sm transition-all focus-within:shadow-md">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-title-md">
          mail
        </span>
<input autocomplete="email" class="w-full h-12 pl-10 pr-4 bg-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/60 focus:outline-none" id="emailInput" placeholder="usuario@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="passwordInput">
          Contraseña
        </label>
<button class="font-label-md text-label-md text-secondary hover:text-primary transition-colors focus:outline-none" onclick="triggerForgotPassword()" type="button">
          ¿Olvidaste tu contraseña?
        </button>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-lg shadow-sm transition-all focus-within:shadow-md">
<span class="material-symbols-outlined text-outline absolute left-3 pointer-events-none text-title-md">
          lock
        </span>
<input autocomplete="current-password" class="w-full h-12 pl-10 pr-12 bg-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/60 focus:outline-none" id="passwordInput" placeholder="Tu clave personal" required="" type="password"/>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3 p-1 text-outline hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-title-md" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- SQLite Offline-First Pill Indicator -->
<div class="flex items-center gap-2 px-3 py-2 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-secondary text-label-lg" style="font-variation-settings: 'FILL' 1;">
        database
      </span>
<p class="font-body-sm text-body-sm text-secondary">
        Sesión cifrada en almacenamiento local SQLite seguro.
      </p>
</div>
<!-- Primary Login Button -->
<button class="w-full h-12 mt-space-xs bg-primary-container text-on-primary rounded-lg font-title-md text-title-md flex items-center justify-center gap-2 active:scale-[0.99] transition-transform shadow-sm hover:opacity-95" id="submitButton" type="submit">
<span>Entrar a StepUp</span>
<span class="material-symbols-outlined text-title-md">arrow_forward</span>
</button>
</form>
<!-- Biometric Quick Access -->
<div class="flex flex-col items-center mt-space-lg gap-space-sm">
<div class="relative w-full flex items-center justify-center py-2">
<div class="w-full h-px bg-surface-container-high absolute"></div>
<span class="relative bg-surface px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">o también</span>
</div>
<button class="w-full h-12 bg-surface-container-lowest rounded-lg shadow-sm flex items-center justify-center gap-2.5 font-label-lg text-label-lg text-on-surface hover:bg-surface-container-low active:scale-[0.99] transition-all" onclick="handleBiometrics()" type="button">
<span class="material-symbols-outlined text-primary-container text-headline-sm">fingerprint</span>
<span>Acceder con biometría</span>
</button>
<!-- Guest / Local Mode Frictionless Route -->
<button class="w-full py-2.5 px-4 rounded-lg bg-surface-container flex items-center justify-between text-on-surface-variant hover:text-on-surface transition-colors" onclick="handleGuestMode()" type="button">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-title-md">offline_bolt</span>
<span class="font-label-md text-label-md font-medium text-left">Continuar como invitado</span>
</div>
<span class="font-label-sm text-label-sm bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-full">Modo Local</span>
</button>
</div>
<!-- Sign Up Footer Route -->
<div class="mt-space-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      ¿No tienes una cuenta? 
      <a class="font-label-md text-label-md text-primary-container font-medium hover:underline inline-flex items-center gap-0.5 ml-1" href="#register">
        Regístrate gratis
        <span class="material-symbols-outlined text-label-sm">north_east</span>
</a>
</p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submitButton');
    if (!btn) return;
    const initialText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-title-md animate-spin">progress_activity</span><span>Sincronizando...</span>`;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = initialText;
      btn.disabled = false;
    }, 1200);
  }

  function handleBiometrics() {
    const btn = event.currentTarget;
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-primary-container text-headline-sm animate-pulse">fingerprint</span><span>Verificando identidad...</span>`;
    setTimeout(() => {
      btn.innerHTML = originalText;
    }, 1000);
  }

  function handleGuestMode() {
    const target = event.currentTarget;
    if (target) {
      target.classList.add('opacity-70');
      setTimeout(() => target.classList.remove('opacity-70'), 400);
    }
  }

  function triggerForgotPassword() {
    alert("Te hemos preparado un enlace de recuperación sereno a tu correo.");
  }
</script></main></body></html>
