<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f9f9fc;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error": "#ba1a1a", "on-secondary": "#ffffff", "on-tertiary-fixed": "#2e1500", "on-tertiary-container": "#dcae88", "on-error-container": "#93000a", "outline-variant": "#c0c9c1", "on-primary": "#ffffff", "on-secondary-fixed": "#0c1f17", "surface-container-lowest": "#ffffff", "secondary": "#4f6358", "primary": "#003a24", "inverse-primary": "#9dd2b3", "primary-container": "#1e5139", "primary-fixed": "#b8efce", "surface": "#f9f9fc", "on-primary-container": "#8ec2a4", "surface-container-highest": "#e2e2e5", "on-primary-fixed-variant": "#1d5038", "surface-variant": "#e2e2e5", "secondary-fixed": "#d2e8da", "on-primary-fixed": "#002112", "surface-container-low": "#f3f3f6", "on-surface-variant": "#414943", "surface-dim": "#dadadc", "surface-tint": "#36684e", "tertiary-fixed": "#ffdcc1", "secondary-container": "#d2e8da", "on-error": "#ffffff", "surface-bright": "#f9f9fc", "on-secondary-fixed-variant": "#384b41", "tertiary-container": "#624123", "on-surface": "#1a1c1e", "on-tertiary-fixed-variant": "#604022", "on-tertiary": "#ffffff", "on-secondary-container": "#55695e", "inverse-surface": "#2f3133", "primary-fixed-dim": "#9dd2b3", "on-background": "#1a1c1e", "inverse-on-surface": "#f0f0f3", "error-container": "#ffdad6", "surface-container-high": "#e8e8ea", "tertiary": "#482b0f", "surface-container": "#eeeef0", "tertiary-fixed-dim": "#edbd96", "outline": "#717972", "secondary-fixed-dim": "#b6ccbe", "background": "#f9f9fc" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2.5rem", "space-xs": "0.25rem", "gutter": "1.25rem", "space-sm": "0.5rem", "margin-tablet": "2rem", "space-lg": "1.5rem", "margin-desktop": "3rem", "space-md": "1rem", "gutter-desktop": "1.5rem", "margin": "1.25rem" }, "fontFamily": { "label-lg": ["Space Grotesk"], "body-lg": ["Inter"], "title-md": ["Space Grotesk"], "body-md": ["Inter"], "headline-md": ["Space Grotesk"], "body-sm": ["Inter"], "headline-sm": ["Space Grotesk"], "headline-lg": ["Space Grotesk"], "label-md": ["Space Grotesk"], "label-sm": ["Space Grotesk"], "display-lg": ["Space Grotesk"], "headline-lg-mobile": ["Space Grotesk"], "display-lg-mobile": ["Space Grotesk"] }, "fontSize": { "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}], "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}], "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600"}], "body-md": ["15px", {"lineHeight": "24px", "fontWeight": "400"}], "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500"}], "body-sm": ["13px", {"lineHeight": "20px", "fontWeight": "400"}], "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "500"}], "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}], "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600"}], "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "600"}], "headline-lg-mobile": ["26px", {"lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600"}], "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600"}] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Go back or close" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface text-center truncate max-w-[200px]">Focus Timer</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-none"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-lg select-none">
<!-- Minimal Ambient Banner Image (Visual Delight / Calm Focus) -->

<!-- Crucible: Central Circular Countdown -->
<div class="w-full rounded-xl p-space-lg flex flex-col items-center justify-center relative overflow-hidden">
<!-- Gentle ambient back-glow ring -->
<div class="absolute w-56 h-56 rounded-full bg-primary-fixed/20 blur-2xl pointer-events-none"></div>
<div class="relative w-56 h-56 flex items-center justify-center">
<!-- SVG Progress Dial -->
<svg class="w-full h-full -rotate-90 transform" viewBox="0 0 200 200">
<!-- Background Track -->
<circle class="text-surface-container" cx="100" cy="100" fill="none" r="84" stroke="currentColor" stroke-width="7"></circle>
<!-- Active Progress Stroke (Animated via JS) -->
<circle class="text-primary-container transition-all duration-1000 ease-linear" cx="100" cy="100" fill="none" id="focus-progress-bar" r="84" stroke="currentColor" stroke-dasharray="527.78" stroke-dashoffset="105.55" stroke-linecap="round" stroke-width="7"></circle>
</svg>
<!-- Center Typography & State -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<div class="inline-flex items-center gap-1 text-secondary font-label-sm text-label-sm mb-0.5 tracking-wider uppercase">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-ping"></span>
<span id="timer-state-label" class="">En Curso</span>
</div>
<div class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight font-medium my-0.5" id="timer-display">
          04:12
        </div>
<div class="text-on-surface-variant font-body-sm text-body-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[15px] text-secondary">hourglass_top</span>
<span class="">Meta: 5 min</span>
</div>
</div>
</div>
<!-- Micro-Controls: Secondary Pill Actions -->
<div class="flex items-center justify-center gap-space-sm mt-space-md w-full max-w-xs">
<button class="flex-1 py-2 px-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 active:scale-95 transition-transform" id="pause-toggle-btn" onclick="toggleTimer()">
<span class="material-symbols-outlined text-[17px] text-secondary" id="pause-icon">pause</span>
<span id="pause-text" class="">Pausar</span>
</button>
<button class="flex-1 py-2 px-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 active:scale-95 transition-transform" onclick="addTwoMinutes()">
<span class="material-symbols-outlined text-[17px] text-secondary">more_time</span>
<span class="">+2 Minutos</span>
</button>
</div>
</div>
<!-- Priority Section: Dominant Step Definition & Anti-Anxiety Framing -->
<div class="mt-space-lg flex flex-col items-center text-center px-2"><span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-1.5">Foco Inmediato</span><h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-snug font-semibold max-w-xs">Definir los 3 endpoints de autenticación en schema.prisma</h2><div class="mt-2.5 flex items-center justify-center gap-1.5 text-on-surface-variant"><span class="material-symbols-outlined text-secondary text-[18px]">spa</span><p class="font-body-md text-body-md text-on-surface-variant">Respira. Solo este paso. Nada más.</p></div></div>
<!-- Subtle Cognitive Anchor: Micro Steps Helper (Zero-Friction Disclosure) -->

<!-- Primary Bottom Completion Action: Thumb Zone -->
<div class="mt-space-lg w-full">
<button class="w-full h-14 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform" id="complete-step-btn" onclick="completeStep()">
<span class="material-symbols-outlined text-[22px] text-on-primary">check</span>
<span class="">MARCAR PASO HECHO</span>
</button>

</div>
<!-- Micro Visual Delight Celebration Toast (Hidden by default) -->
<div class="fixed inset-x-margin bottom-6 bg-surface-container-highest/95 backdrop-blur-md rounded-xl p-4 shadow-xl transform translate-y-32 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-3 z-50" id="completion-toast">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]">done_all</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<span class="font-title-md text-title-md text-on-surface font-semibold truncate">¡Paso 2 completado!</span>
<span class="font-body-sm text-body-sm text-secondary truncate">Preparando el siguiente micro-foco...</span>
</div>
</div>
</div>
<script>
  let totalSeconds = 252; // 04:12 initial
  let maxSeconds = 300;   // 05:00 baseline
  let isPaused = false;
  const circumference = 2 * Math.PI * 84; // ~527.78

  const timerDisplay = document.getElementById('timer-display');
  const progressBar = document.getElementById('focus-progress-bar');
  const pauseIcon = document.getElementById('pause-icon');
  const pauseText = document.getElementById('pause-text');
  const timerStateLabel = document.getElementById('timer-state-label');
  const toast = document.getElementById('completion-toast');

  function updateTimerUI() {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    timerDisplay.textContent = 
      String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    
    // Calculate SVG offset: 0 seconds left = full stroke offset
    const progressRatio = Math.max(0, Math.min(1, totalSeconds / maxSeconds));
    const offset = circumference * (1 - progressRatio);
    progressBar.style.strokeDashoffset = offset;
  }

  const countdownInterval = setInterval(() => {
    if (!isPaused && totalSeconds > 0) {
      totalSeconds--;
      updateTimerUI();
    }
  }, 1000);

  function toggleTimer() {
    isPaused = !isPaused;
    if (isPaused) {
      pauseIcon.textContent = 'play_arrow';
      pauseText.textContent = 'Reanudar';
      timerStateLabel.textContent = 'En Pausa';
      timerStateLabel.classList.add('text-on-surface-variant');
      timerStateLabel.classList.remove('text-secondary');
    } else {
      pauseIcon.textContent = 'pause';
      pauseText.textContent = 'Pausar';
      timerStateLabel.textContent = 'En Curso';
      timerStateLabel.classList.add('text-secondary');
      timerStateLabel.classList.remove('text-on-surface-variant');
    }
  }

  function addTwoMinutes() {
    totalSeconds += 120;
    if (totalSeconds > maxSeconds) {
      maxSeconds = totalSeconds;
    }
    updateTimerUI();
  }

  function completeStep() {
    toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');
    const btn = document.getElementById('complete-step-btn');
    btn.classList.add('bg-secondary');
    btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>COMPLETADO</span>';
    
    setTimeout(() => {
      toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 2800);
  }

  updateTimerUI();
</script></main>

</body></html>
