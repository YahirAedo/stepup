name: CI - Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies (npm ci)
        run: npm ci

      - name: 🔍 Run Lint
        run: npm run lint

      - name: 🏃 Run TypeCheck
        run: npm run typecheck

      - name: 🧪 Run Tests
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stepup_user
          POSTGRES_PASSWORD: stepup_password
          POSTGRES_DB: stepup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://stepup_user:stepup_password@localhost:5432/stepup_test?schema=public
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📥 Install dependencies (npm ci)
        run: npm ci

      - name: 🧪 Run Backend Tests
        run: npm test