name: CI - Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies (npm ci)
        run: npm ci

      - name: 🔍 Run Lint
        run: npm run lint

      - name: 🏃 Run TypeCheck
        run: npm run typecheck

      - name: 🧪 Run Tests
        run: npm test