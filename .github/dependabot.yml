version: 2
updates:
  # App (Expo SDK 54)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - chore
      - dependencies
    groups:
      app-patches-and-minors:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Compatibilidad con Expo SDK 54: no subir majors de paquetes expo/react-native (ej. @expo/metro-runtime 57.x, datetimepicker 9.x)
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@react-native-community/*'
        update-types:
          - version-update:semver-major

  # Backend (Node.js + Express + Prisma)
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - chore
      - dependencies
    groups:
      backend-patches-and-minors:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - chore
      - dependencies
    groups:
      actions-patches-and-minors:
        patterns:
          - '*'
        update-types:
          - minor
          - patch