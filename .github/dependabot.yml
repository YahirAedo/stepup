version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "chore"
    ignore:
      - dependency-name: "expo"
        versions: ["55.x", "56.x", "57.x", "58.x", "59.x"]
      - dependency-name: "react-native"
        versions: ["0.82.x", "0.83.x", "0.84.x", "0.85.x", "0.86.x", "0.87.x", "0.88.x", "0.89.x"]
      - dependency-name: "postcss"
        versions: ["8.5.x", "8.6.x", "8.7.x"]
      - dependency-name: "@babel/core"
        versions: ["8.x"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "chore"