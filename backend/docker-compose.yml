version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stepup-postgres
    restart: always
    environment:
      POSTGRES_USER: stepup_user
      POSTGRES_PASSWORD: stepup_password
      POSTGRES_DB: stepup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
